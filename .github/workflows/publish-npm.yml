name: Publish to Private npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # needs cannot cross workflow files. Publish must depend on checks for this
  # tag in this workflow; keep the checks.yml matrix here too.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines sets a minimum; cover it and tested LTS branches, add new LTS.
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Validate tag and package identity
        run: node scripts/validate-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npx playwright install --with-deps chromium
      - run: npm run check
  publish:
    needs: check
    if: github.repository == 'sobermh/tokens_DshConnect_code' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.tokensapi.ai/
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm run build
      - name: Pack and inspect the checked release
        # npm supports --ignore-scripts; the matrix already ran tests.
        run: |
          mkdir -p .release
          npm pack --ignore-scripts --pack-destination .release
          node scripts/verify-tarball.mjs .release/*.tgz
      - name: 检查 · 发布包检查的只读凭证
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${NODE_AUTH_TOKEN:-}" ]] || { echo '::error::请配置只读 Secret PLUGIN_CHECK_REGISTRY_TOKEN'; exit 1; }
          [[ "$(npm whoami --registry=https://npm.tokensapi.ai/)" == market ]] || { echo '::error::包检查需要 market 只读账号'; exit 1; }
      - name: Publish and verify Verdaccio release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_PUBLISH_TOKEN }}
        run: |
          node scripts/registry-release.mjs check
          npm publish .release/*.tgz --ignore-scripts --registry=https://npm.tokensapi.ai/ --tag=latest
          node scripts/registry-release.mjs verify .release/*.tgz
      - name: 报告 · 输出已发布的准确版本
        id: package
        run: node -p '"package=" + require("./package.json").name + "@" + require("./package.json").version' >> "$GITHUB_OUTPUT"

  package-check:
    name: 检查 · 插件发布包
    needs: publish
    uses: TokensAPI/tokens_DshPluginCheck_code/.github/workflows/check-plugin-package.yml@e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    with:
      package: ${{ needs.publish.outputs.package }}
      checker_ref: e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    secrets:
      PLUGIN_CHECK_REGISTRY_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
